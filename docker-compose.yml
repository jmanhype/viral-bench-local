version: "3.9"

# Viral-Bench Local — Docker Compose
# Usage: docker compose up -d
# Docs:  docs/optimization-guide.md

services:
  # ─── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: viralbench
      POSTGRES_USER: vbl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      # pg_isready defaults DB to the username; target the configured POSTGRES_DB.
      test: ["CMD-SHELL", "pg_isready -U vbl -d viralbench"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant image has no curl; use bash + /dev/tcp to hit /healthz and assert HTTP 200 OK.
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; IFS= read -r line <&3; exec 3>&-; case \"$$line\" in *\"200 OK\"*) exit 0;; *) exit 1;; esac'"
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-vbladmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ───────────────────────────────────
  research-api:
    build:
      context: .
      target: research-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://vbl:${POSTGRES_PASSWORD}@postgres:5432/viralbench
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-vbladmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
      MODELSCOPE_API_KEY: ${MODELSCOPE_API_KEY:?Set MODELSCOPE_API_KEY in .env}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:?Set SCRAPER_API_KEY in .env}
      VBL_DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  scraper-api:
    build:
      context: .
      target: scraper-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      DATABASE_URL: postgresql+asyncpg://vbl:${POSTGRES_PASSWORD}@postgres:5432/viralbench
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-vbladmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:?Set SCRAPER_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  browser-worker:
    build:
      context: .
      target: browser-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8020:8020"
    environment:
      DATABASE_URL: postgresql+asyncpg://vbl:${POSTGRES_PASSWORD}@postgres:5432/viralbench
      REDIS_URL: redis://redis:6379
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      VBL_DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  renderer:
    build:
      context: .
      target: renderer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8031:8031"
    environment:
      DATABASE_URL: postgresql+asyncpg://vbl:${POSTGRES_PASSWORD}@postgres:5432/viralbench
      COMFYUI_URL: ${COMFYUI_URL:-http://gpu-server:8188}
    depends_on:
      postgres:
        condition: service_healthy

  publisher:
    build:
      context: .
      target: publisher
    restart: unless-stopped
    ports:
      - "127.0.0.1:8030:8030"
    environment:
      DATABASE_URL: postgresql+asyncpg://vbl:${POSTGRES_PASSWORD}@postgres:5432/viralbench
      REDIS_URL: redis://redis:6379
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-vbladmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── ego-browser Bridge (HOST-ONLY, not containerized) ──────
  # ego-browser is a macOS-native binary — cannot run in Linux containers.
  # This service runs on the host and is reachable from containers via
  # host.docker.internal:8040. Start manually: python services/ego-bridge/app.py
  # Listed here for documentation; NOT started by `docker compose up`.
  # ego-bridge:
  #   build: N/A — runs on host
  #   ports: ["127.0.0.1:8040:8040"]

  # ─── H3 Bridge (HOST-ONLY, SSH proxy to 3090 GPU server) ───
  # Docker Desktop Mac containers cannot SSH to LAN IPs.
  # This service runs on the Mac host where SSH works and proxies
  # submit/status/retrieve calls to the 3090. Containers call it
  # via host.docker.internal:8041.
  # Start: .venv/bin/python services/h3-bridge/app.py
  # h3-bridge:
  #   build: N/A — runs on host
  #   ports: ["127.0.0.1:8041:8041"]

  # ─── Style Refresh (HOST-ONLY, depends on ego-bridge) ──────
  # Drives Lost Future GPT via ego-bridge to generate new visual styles.
  # Start: .venv/bin/python services/style-refresh/app.py
  # style-refresh:
  #   build: N/A — runs on host
  #   ports: ["127.0.0.1:8050:8050"]

  # ─── Character Refresh (HOST-ONLY, depends on ego-bridge) ──
  # Drives Lost Future GPT via ego-bridge to generate character bibles.
  # Start: .venv/bin/python services/character-refresh/app.py
  # character-refresh:
  #   build: N/A — runs on host
  #   ports: ["127.0.0.1:8051:8051"]

  # ─── SGOS Backend (H3 pipeline + keeper metadata API) ────────
  # Containerized sgos-backend with SSH access to 3090 GPU server.
  # Build context is ../sgos-backend (sibling repo).
  sgos-backend:
    build:
      context: ../sgos-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8420:8420"
    volumes:
      - "${HOME}/.ssh:/root/.ssh:ro"
    environment:
      H3_GPU_HOST: ${H3_GPU_HOST:-192.168.1.143}
      H3_GPU_USER: ${H3_GPU_USER:-straughter}
      H3_REMOTE_HOME: ${H3_REMOTE_HOME:-/home/straughter/Wan2GP}
      SGOS_API_KEY: ${SGOS_API_KEY:-}
    extra_hosts:
      - "gpu-server:192.168.1.143"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8420/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pg_data:
  qdrant_data:
  minio_data:
