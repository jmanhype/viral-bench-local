version: "3.9"

# Viral-Bench Local — Docker Compose
# Usage: docker compose up -d
# Docs:  docs/optimization-guide.md

services:
  # ─── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: viralbench
      POSTGRES_USER: vbl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vbl_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbl"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-vbladmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-vbl_secret_123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ───────────────────────────────────
  research-api:
    build:
      context: .
      target: research-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://vbl:${POSTGRES_PASSWORD:-vbl_secret}@postgres:5432/viralbench
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-vbladmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-vbl_secret_123}
      MODELSCOPE_API_KEY: ${MODELSCOPE_API_KEY:?Set MODELSCOPE_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  scraper-api:
    build:
      context: .
      target: scraper-api
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: postgresql+asyncpg://vbl:${POSTGRES_PASSWORD:-vbl_secret}@postgres:5432/viralbench
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-vbladmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-vbl_secret_123}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  browser-worker:
    build:
      context: .
      target: browser-worker
    restart: unless-stopped
    ports:
      - "8020:8020"
    environment:
      DATABASE_URL: postgresql+asyncpg://vbl:${POSTGRES_PASSWORD:-vbl_secret}@postgres:5432/viralbench
      REDIS_URL: redis://redis:6379
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-local-dev-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  renderer:
    build:
      context: .
      target: renderer
    restart: unless-stopped
    ports:
      - "8031:8031"
    environment:
      DATABASE_URL: postgresql+asyncpg://vbl:${POSTGRES_PASSWORD:-vbl_secret}@postgres:5432/viralbench
      COMFYUI_URL: ${COMFYUI_URL:-http://gpu-server:8188}
    depends_on:
      postgres:
        condition: service_healthy

  publisher:
    build:
      context: .
      target: publisher
    restart: unless-stopped
    ports:
      - "8030:8030"
    environment:
      DATABASE_URL: postgresql+asyncpg://vbl:${POSTGRES_PASSWORD:-vbl_secret}@postgres:5432/viralbench
      REDIS_URL: redis://redis:6379
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-vbladmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-vbl_secret_123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pg_data:
  qdrant_data:
  minio_data:
